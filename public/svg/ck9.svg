<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Hình minh họa">
  <defs>
    <radialGradient id="ck9-bg" cx=".5" cy=".4" r=".85"><stop offset="0" stop-color="#FFFBF2"></stop><stop offset="1" stop-color="#E8D3AE"></stop></radialGradient>
    <radialGradient id="ck9-apple" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#ff7a6a"></stop><stop offset=".55" stop-color="#d42a24"></stop><stop offset="1" stop-color="#8a0f12"></stop></radialGradient>
    <radialGradient id="ck9-flesh" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#fffbe0"></stop><stop offset=".7" stop-color="#f6e7a8"></stop><stop offset="1" stop-color="#d9c77a"></stop></radialGradient>
    <linearGradient id="ck9-peel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2342c"></stop><stop offset="1" stop-color="#8a0f12"></stop></linearGradient>
    <linearGradient id="ck9-orange" x1="0" x2="1"><stop offset="0" stop-color="#c24a05"></stop><stop offset=".4" stop-color="#ff9a3c"></stop><stop offset="1" stop-color="#c24a05"></stop></linearGradient>
    <linearGradient id="ck9-steelH" x1="0" x2="1"><stop offset="0" stop-color="#6b727c"></stop><stop offset=".3" stop-color="#eceff2"></stop><stop offset="1" stop-color="#7a818b"></stop></linearGradient>
    <filter id="ck9-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter>
    <filter id="ck9-sh" x="-20%" y="-20%" width="140%" height="150%"><fedropshadow dx="0" dy="4" stdDeviation="4" flood-color="#2a1000" flood-opacity=".4"></fedropshadow></filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#ck9-bg)"></rect>
  <ellipse cx="195" cy="226" rx="90" ry="10" fill="#3a2a10" opacity=".35" filter="url(#ck9-blur)"></ellipse>
  <!-- apple -->
  <g filter="url(#ck9-sh)">
    <circle cx="190" cy="140" r="78" fill="url(#ck9-apple)"></circle>
  </g>
  <path d="M190 62 A78 78 0 0 0 190 218 Q148 140 190 62 Z" fill="url(#ck9-flesh)"></path>
  <path d="M190 62 Q170 100 168 140 Q172 180 190 218" fill="none" stroke="#d9c77a" stroke-width="3"></path>
  <path d="M176 100 Q168 140 176 180" fill="none" stroke="#fff" stroke-width="5" opacity=".5" stroke-linecap="round"></path>
  <path d="M190 62 Q192 48 202 36" fill="none" stroke="#6b3a14" stroke-width="5" stroke-linecap="round"></path>
  <ellipse cx="222" cy="108" rx="14" ry="28" fill="#fff" opacity=".28" transform="rotate(18 222 108)"></ellipse>
  <g fill="#f4d56a" opacity=".5"><circle cx="236" cy="150" r="2"></circle><circle cx="224" cy="176" r="2"></circle><circle cx="246" cy="128" r="2"></circle></g>
  <!-- peel strip -->
  <g filter="url(#ck9-sh)">
    <path d="M120 100 Q70 130 95 170 Q130 205 85 240 Q70 255 100 268" fill="none" stroke="url(#ck9-peel)" stroke-width="15" stroke-linecap="round"></path>
  </g>
  <path d="M120 100 Q70 130 95 170 Q130 205 85 240 Q70 255 100 268" fill="none" stroke="#f6e7a8" stroke-width="4" stroke-linecap="round" opacity=".75" transform="translate(2 0)"></path>
  <!-- peeler -->
  <g transform="rotate(35 170 150)" filter="url(#ck9-sh)">
    <rect x="215" y="18" width="15" height="96" rx="7" fill="url(#ck9-orange)"></rect>
    <path d="M198 110 H247 V126 H233 V152 H212 V126 H198 Z" fill="url(#ck9-steelH)"></path>
    <rect x="208" y="126" width="34" height="7" fill="#4b5563"></rect>
    <rect x="218" y="134" width="14" height="4" fill="#2f353d"></rect>
  </g>
</svg>