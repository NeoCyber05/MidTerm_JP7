<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Hình minh họa">
  <defs>
    <radialGradient id="ck7-bg" cx=".5" cy=".4" r=".85"><stop offset="0" stop-color="#FFFBF2"></stop><stop offset="1" stop-color="#E8D3AE"></stop></radialGradient>
    <linearGradient id="ck7-board" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2b77c"></stop><stop offset="1" stop-color="#c0894a"></stop></linearGradient>
    <radialGradient id="ck7-pep" cx=".35" cy=".25" r=".95"><stop offset="0" stop-color="#fff07a"></stop><stop offset=".6" stop-color="#f7c818"></stop><stop offset="1" stop-color="#c78f00"></stop></radialGradient>
    <linearGradient id="ck7-inside" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0"></stop><stop offset="1" stop-color="#f5cf3a"></stop></linearGradient>
    <linearGradient id="ck7-blade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f7fa"></stop><stop offset=".5" stop-color="#b6bcc4"></stop><stop offset="1" stop-color="#7d848e"></stop></linearGradient>
    <linearGradient id="ck7-handle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b4b4b"></stop><stop offset="1" stop-color="#151515"></stop></linearGradient>
    <filter id="ck7-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter>
    <filter id="ck7-sh" x="-20%" y="-20%" width="140%" height="150%"><fedropshadow dx="0" dy="5" stdDeviation="4" flood-color="#2a1800" flood-opacity=".45"></fedropshadow></filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#ck7-bg)"></rect>
  <!-- board -->
  <g filter="url(#ck7-sh)">
    <polygon points="40,212 360,212 386,255 14,255" fill="url(#ck7-board)"></polygon>
    <rect x="14" y="255" width="372" height="14" rx="4" fill="#a8733a"></rect>
  </g>
  <g stroke="#b07a3e" stroke-width="1.5" opacity=".6" fill="none">
    <path d="M60 222 H340"></path><path d="M52 232 H350"></path><path d="M42 243 H358"></path>
  </g>
  <!-- pepper half -->
  <g filter="url(#ck7-sh)">
    <path d="M95 140 Q80 150 85 190 Q92 215 130 215 Q165 215 170 190 Q175 150 160 140 Q130 130 95 140 Z" fill="url(#ck7-pep)"></path>
  </g>
  <path d="M105 150 Q97 175 108 202" fill="none" stroke="#fff9c4" stroke-width="6" stroke-linecap="round" opacity=".8"></path>
  <path d="M146 150 Q158 175 150 202" fill="none" stroke="#c78f00" stroke-width="3" stroke-linecap="round" opacity=".5"></path>
  <path d="M118 136 Q127 110 143 128" fill="none" stroke="#4d7c0f" stroke-width="10" stroke-linecap="round"></path>
  <path d="M120 133 Q127 114 138 124" fill="none" stroke="#a3d84a" stroke-width="3" stroke-linecap="round"></path>
  <!-- slices -->
  <g filter="url(#ck7-sh)">
    <path d="M198 160 Q186 175 193 206 Q210 217 226 213 Q234 184 222 160 Z" fill="url(#ck7-pep)"></path>
    <path d="M246 170 Q238 190 245 209 Q258 216 271 211 Q276 190 268 170 Z" fill="url(#ck7-pep)"></path>
  </g>
  <ellipse cx="210" cy="162" rx="12" ry="4" fill="url(#ck7-inside)"></ellipse><ellipse cx="257" cy="172" rx="11" ry="4" fill="url(#ck7-inside)"></ellipse>
  <g fill="#fff7c0"><circle cx="206" cy="161" r="1.5"></circle><circle cx="214" cy="164" r="1.5"></circle><circle cx="255" cy="171" r="1.5"></circle></g>
  <!-- knife -->
  <g transform="rotate(-25 190 120)" filter="url(#ck7-sh)">
    <polygon points="170,70 262,70 272,150 170,150" fill="url(#ck7-blade)" stroke="#8d949e" stroke-width="1.5"></polygon>
    <polygon points="170,138 272,138 272,150 170,150" fill="#fff" opacity=".5"></polygon>
    <rect x="262" y="82" width="82" height="24" rx="9" fill="url(#ck7-handle)"></rect>
    <circle cx="287" cy="94" r="3.5" fill="#c9ced4"></circle><circle cx="318" cy="94" r="3.5" fill="#c9ced4"></circle>
    <rect x="262" y="82" width="82" height="5" rx="2" fill="#fff" opacity=".2"></rect>
  </g>
</svg>