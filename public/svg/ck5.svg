    <linearGradient id="ck5-bamboo" x1="0" x2="1"><stop offset="0" stop-color="#a8692c"></stop><stop offset=".3" stop-color="#e2b074"></stop><stop offset=".65" stop-color="#c58a4c"></stop><stop offset="1" stop-color="#8a5220"></stop></linearGradient>
    <linearGradient id="ck5-steelH" x1="0" x2="1"><stop offset="0" stop-color="#6b727c"></stop><stop offset=".25" stop-color="#e3e6ea"></stop><stop offset=".6" stop-color="#9aa1ab"></stop><stop offset="1" stop-color="#555c66"></stop></linearGradient>
    <radialGradient id="ck5-mat" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#fbf0d8"></stop><stop offset="1" stop-color="#e2c994"></stop></radialGradient>
