<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Hình minh họa">
  <defs>
    <radialGradient id="ck8-bg" cx=".5" cy=".4" r=".85"><stop offset="0" stop-color="#FFFBF2"></stop><stop offset="1" stop-color="#E8D3AE"></stop></radialGradient>
    <linearGradient id="ck8-slate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b5563"></stop><stop offset="1" stop-color="#1f2630"></stop></linearGradient>
    <linearGradient id="ck8-stalk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fe36a"></stop><stop offset=".5" stop-color="#2f9a38"></stop><stop offset="1" stop-color="#176b24"></stop></linearGradient>
    <radialGradient id="ck8-ring" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#d8ffc2"></stop><stop offset=".6" stop-color="#6fd052"></stop><stop offset="1" stop-color="#2a8a2e"></stop></radialGradient>
    <linearGradient id="ck8-blade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f7fa"></stop><stop offset=".5" stop-color="#b6bcc4"></stop><stop offset="1" stop-color="#7d848e"></stop></linearGradient>
    <linearGradient id="ck8-handle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9783a"></stop><stop offset="1" stop-color="#6a3a14"></stop></linearGradient>
    <filter id="ck8-sh" x="-20%" y="-20%" width="140%" height="150%"><fedropshadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity=".5"></fedropshadow></filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#ck8-bg)"></rect>
  <g filter="url(#ck8-sh)">
    <polygon points="40,212 360,212 386,255 14,255" fill="url(#ck8-slate)"></polygon>
    <rect x="14" y="255" width="372" height="14" rx="4" fill="#111827"></rect>
  </g>
  <!-- long green onion -->
  <g stroke-linecap="round" fill="none" filter="url(#ck8-sh)">
    <path d="M40 192 Q110 172 200 177" stroke="url(#ck8-stalk)" stroke-width="20"></path>
    <path d="M40 192 Q110 172 200 177" stroke="#c8f5a8" stroke-width="5" opacity=".7" transform="translate(0 -5)"></path>
    <path d="M32 178 Q20 156 28 138" stroke="#2f9a38" stroke-width="9"></path>
    <path d="M36 202 Q22 218 30 234" stroke="#f2f6e8" stroke-width="9"></path>
    <path d="M34 196 Q26 204 28 212" stroke="#cfe3b0" stroke-width="7"></path>
  </g>
  <!-- chopped bits -->
  <g filter="url(#ck8-sh)" fill="url(#ck8-ring)">
    <rect x="214" y="180" width="14" height="14" rx="4" transform="rotate(10 221 187)"></rect>
    <rect x="238" y="195" width="12" height="12" rx="4" transform="rotate(-15 244 201)"></rect>
    <rect x="262" y="182" width="14" height="14" rx="4" transform="rotate(25 269 189)"></rect>
    <rect x="285" y="198" width="12" height="12" rx="4"></rect>
    <rect x="305" y="185" width="14" height="14" rx="4" transform="rotate(-10 312 192)"></rect>
    <rect x="250" y="210" width="12" height="12" rx="4" transform="rotate(20 256 216)"></rect>
    <rect x="330" y="205" width="12" height="12" rx="4" transform="rotate(8 336 211)"></rect>
    <rect x="228" y="200" width="10" height="10" rx="3"></rect><rect x="275" y="206" width="10" height="10" rx="3"></rect><rect x="318" y="208" width="10" height="10" rx="3"></rect>
  </g>
  <g fill="#f4ffe6" opacity=".8"><circle cx="221" cy="187" r="3"></circle><circle cx="269" cy="189" r="3"></circle><circle cx="312" cy="192" r="3"></circle><circle cx="244" cy="201" r="2.5"></circle></g>
  <!-- knife -->
  <g transform="rotate(-20 190 110)" filter="url(#ck8-sh)">
    <polygon points="150,80 252,80 262,136 150,136" fill="url(#ck8-blade)" stroke="#8d949e" stroke-width="1.5"></polygon>
    <polygon points="150,124 262,124 262,136 150,136" fill="#fff" opacity=".5"></polygon>
    <rect x="252" y="92" width="86" height="24" rx="9" fill="url(#ck8-handle)"></rect>
    <circle cx="278" cy="104" r="3.5" fill="#f6d98a"></circle><circle cx="310" cy="104" r="3.5" fill="#f6d98a"></circle>
  </g>
  <g stroke="#9ca3af" stroke-width="3" stroke-linecap="round" fill="none" opacity=".8">
    <path d="M120 50 q10 -10 22 -8"></path><path d="M130 65 q10 -10 22 -8"></path>
  </g>
</svg>