<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Hình minh họa">
  <defs>
    <radialGradient id="ck11-bg" cx=".5" cy=".4" r=".85"><stop offset="0" stop-color="#FFFBF2"></stop><stop offset="1" stop-color="#E8D3AE"></stop></radialGradient>
    <linearGradient id="ck11-glass" x1="0" x2="1"><stop offset="0" stop-color="#bfe3f5" stop-opacity=".9"></stop><stop offset=".3" stop-color="#f4fbff" stop-opacity=".95"></stop><stop offset=".7" stop-color="#cfe9f7" stop-opacity=".85"></stop><stop offset="1" stop-color="#8fc3de" stop-opacity=".9"></stop></linearGradient>
    <linearGradient id="ck11-oil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"></stop><stop offset="1" stop-color="#e08e0b"></stop></linearGradient>
    <radialGradient id="ck11-milk" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#ffffff"></stop><stop offset="1" stop-color="#e9ecef"></stop></radialGradient>
    <linearGradient id="ck11-arrow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b5e"></stop><stop offset="1" stop-color="#c81e1e"></stop></linearGradient>
    <clipPath id="ck11-jar"><path d="M0 0 H82 L76 92 Q74 106 60 106 H22 Q8 106 6 92 Z"></path></clipPath>
    <filter id="ck11-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter>
    <filter id="ck11-sh" x="-20%" y="-20%" width="140%" height="150%"><fedropshadow dx="0" dy="4" stdDeviation="3" flood-color="#2a1800" flood-opacity=".4"></fedropshadow></filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#ck11-bg)"></rect>
  <ellipse cx="200" cy="270" rx="110" ry="10" fill="#3a2a10" opacity=".35" filter="url(#ck11-blur)"></ellipse>
  <!-- bowl -->
  <path d="M110 170 Q115 266 200 270 Q285 266 290 170 Z" fill="url(#ck11-glass)" stroke="#9ccbe3" stroke-width="2"></path>
  <path d="M124 196 Q128 244 156 256" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"></path>
  <ellipse cx="200" cy="170" rx="90" ry="22" fill="#eef8fd" stroke="#9ccbe3" stroke-width="2"></ellipse>
  <ellipse cx="200" cy="174" rx="80" ry="17" fill="url(#ck11-milk)"></ellipse>
  <ellipse cx="177" cy="174" rx="22" ry="7" fill="none" stroke="#e6b23a" stroke-width="2" opacity=".8"></ellipse>
  <ellipse cx="177" cy="174" rx="12" ry="4" fill="url(#ck11-oil)"></ellipse>
  <ellipse cx="177" cy="174" rx="34" ry="10" fill="none" stroke="#fff" stroke-width="1.5" opacity=".7"></ellipse>
  <!-- oil stream -->
  <path d="M150 97 Q156 140 172 170" fill="none" stroke="#c97a08" stroke-width="10" stroke-linecap="round"></path>
  <path d="M150 97 Q156 140 172 170" fill="none" stroke="url(#ck11-oil)" stroke-width="7" stroke-linecap="round"></path>
  <path d="M149 108 Q153 138 166 164" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".7"></path>
  <!-- jug -->
  <g transform="translate(150 97) rotate(-35)" filter="url(#ck11-sh)">
    <path d="M0 0 H82 L76 92 Q74 106 60 106 H22 Q8 106 6 92 Z" fill="url(#ck11-glass)" stroke="#9ccbe3" stroke-width="2"></path>
    <g clip-path="url(#ck11-jar)"><rect x="-60" y="48" width="220" height="120" fill="url(#ck11-oil)" transform="rotate(35 40 60)"></rect></g>
    <path d="M14 14 L12 88" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".75"></path>
    <path d="M66 14 L64 60" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".5"></path>
  </g>
  <!-- red arrow -->
  <g transform="translate(318 78) rotate(50)" filter="url(#ck11-sh)">
    <polygon points="0,44 -28,12 -11,12 -11,-30 11,-30 11,12 28,12" fill="url(#ck11-arrow)" stroke="#fff" stroke-width="3" stroke-linejoin="round"></polygon>
  </g>
</svg>