    <linearGradient id="ck6-steelH" x1="0" x2="1"><stop offset="0" stop-color="#6b727c"></stop><stop offset=".22" stop-color="#e9ecf0"></stop><stop offset=".55" stop-color="#9aa1ab"></stop><stop offset="1" stop-color="#555c66"></stop></linearGradient>
    <linearGradient id="ck6-rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f8"></stop><stop offset="1" stop-color="#8d949e"></stop></linearGradient>
    <radialGradient id="ck6-broth" cx=".5" cy=".4" r=".75"><stop offset="0" stop-color="#f6df8a"></stop><stop offset=".7" stop-color="#dcb450"></stop><stop offset="1" stop-color="#a97f1e"></stop></radialGradient>
