<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Hình minh họa">
  <defs>
    <radialGradient id="ck10-bg" cx=".5" cy=".4" r=".85"><stop offset="0" stop-color="#FFFBF2"></stop><stop offset="1" stop-color="#E8D3AE"></stop></radialGradient>
    <linearGradient id="ck10-glass" x1="0" x2="1"><stop offset="0" stop-color="#bfe3f5" stop-opacity=".9"></stop><stop offset=".3" stop-color="#f4fbff" stop-opacity=".95"></stop><stop offset=".7" stop-color="#cfe9f7" stop-opacity=".85"></stop><stop offset="1" stop-color="#8fc3de" stop-opacity=".9"></stop></linearGradient>
    <radialGradient id="ck10-egg" cx=".45" cy=".35" r=".75"><stop offset="0" stop-color="#ffd66b"></stop><stop offset=".65" stop-color="#fb9d1f"></stop><stop offset="1" stop-color="#d56d05"></stop></radialGradient>
    <linearGradient id="ck10-wire" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f3f5"></stop><stop offset="1" stop-color="#7a818b"></stop></linearGradient>
    <linearGradient id="ck10-handle" x1="0" x2="1"><stop offset="0" stop-color="#1f2937"></stop><stop offset=".4" stop-color="#6b7280"></stop><stop offset="1" stop-color="#111827"></stop></linearGradient>
    <filter id="ck10-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter>
    <filter id="ck10-sh" x="-20%" y="-20%" width="140%" height="150%"><fedropshadow dx="0" dy="4" stdDeviation="3" flood-color="#2a1800" flood-opacity=".4"></fedropshadow></filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#ck10-bg)"></rect>
  <ellipse cx="200" cy="262" rx="140" ry="12" fill="#3a2a10" opacity=".35" filter="url(#ck10-blur)"></ellipse>
  <!-- bowl -->
  <path d="M60 140 Q70 245 200 252 Q330 245 340 140 Z" fill="url(#ck10-glass)" stroke="#9ccbe3" stroke-width="2"></path>
  <path d="M82 170 Q92 228 140 240" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"></path>
  <path d="M74 150 Q75 160 78 170" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"></path>
  <ellipse cx="200" cy="140" rx="140" ry="36" fill="#eef8fd" stroke="#9ccbe3" stroke-width="2"></ellipse>
  <ellipse cx="200" cy="146" rx="124" ry="28" fill="url(#ck10-egg)"></ellipse>
  <ellipse cx="180" cy="141" rx="78" ry="12" fill="#fff" opacity=".35"></ellipse>
  <path d="M128 150 Q170 172 226 150 Q266 132 278 150" fill="none" stroke="#ffe3a8" stroke-width="4" stroke-linecap="round"></path>
  <path d="M150 156 Q190 168 240 156" fill="none" stroke="#d56d05" stroke-width="2" stroke-linecap="round" opacity=".5"></path>
  <g fill="#fff" fill-opacity=".6" stroke="#fff" stroke-opacity=".7"><circle cx="150" cy="140" r="3"></circle><circle cx="256" cy="150" r="3.5"></circle><circle cx="222" cy="136" r="2.5"></circle></g>
  <!-- whisk -->
  <g transform="rotate(25 200 120)" filter="url(#ck10-sh)">
    <rect x="191" y="8" width="18" height="58" rx="8" fill="url(#ck10-handle)"></rect>
    <rect x="193" y="12" width="4" height="48" rx="2" fill="#fff" opacity=".25"></rect>
    <g fill="none" stroke="url(#ck10-wire)" stroke-width="3">
      <ellipse cx="200" cy="106" rx="27" ry="42"></ellipse>
      <ellipse cx="200" cy="106" rx="14" ry="42"></ellipse>
      <ellipse cx="200" cy="106" rx="21" ry="42" transform="rotate(8 200 106)"></ellipse>
      <line x1="200" y1="64" x2="200" y2="148"></line>
    </g>
    <rect x="195" y="62" width="10" height="8" rx="3" fill="#aeb4bc"></rect>
  </g>
  <path d="M310 110 Q345 100 350 70" fill="none" stroke="#6b7280" stroke-width="4" stroke-linecap="round"></path>
  <polygon points="342,72 358,66 355,84" fill="#6b7280"></polygon>
</svg>