<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Hình minh họa">
  <defs>
    <radialGradient id="ck1-bg" cx=".5" cy=".4" r=".85"><stop offset="0" stop-color="#FFFBF2"></stop><stop offset="1" stop-color="#E8D3AE"></stop></radialGradient>
    <linearGradient id="ck1-steelH" x1="0" x2="1"><stop offset="0" stop-color="#6b727c"></stop><stop offset=".22" stop-color="#e9ecf0"></stop><stop offset=".55" stop-color="#9aa1ab"></stop><stop offset="1" stop-color="#555c66"></stop></linearGradient>
    <linearGradient id="ck1-rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f8"></stop><stop offset="1" stop-color="#8d949e"></stop></linearGradient>
    <radialGradient id="ck1-oil" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#ffe680"></stop><stop offset=".7" stop-color="#f2b524"></stop><stop offset="1" stop-color="#c98a0c"></stop></radialGradient>
    <linearGradient id="ck1-batter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8d58a"></stop><stop offset=".5" stop-color="#e8a03a"></stop><stop offset="1" stop-color="#b9701c"></stop></linearGradient>
    <linearGradient id="ck1-tail" x1="0" x2="1"><stop offset="0" stop-color="#f26a3d"></stop><stop offset="1" stop-color="#c23b1c"></stop></linearGradient>
    <radialGradient id="ck1-bub" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".9"></stop><stop offset=".6" stop-color="#fff" stop-opacity=".15"></stop><stop offset="1" stop-color="#fff" stop-opacity=".6"></stop></radialGradient>
    <filter id="ck1-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter>
    <filter id="ck1-sh" x="-20%" y="-20%" width="140%" height="150%"><fedropshadow dx="0" dy="3" stdDeviation="3" flood-color="#3a2400" flood-opacity=".45"></fedropshadow></filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#ck1-bg)"></rect>
  <ellipse cx="200" cy="268" rx="160" ry="14" fill="#3a2a10" opacity=".35" filter="url(#ck1-blur)"></ellipse>
  <!-- pot -->
  <path d="M70 150 V238 Q70 262 94 262 H306 Q330 262 330 238 V150 Z" fill="url(#ck1-steelH)"></path>
  <rect x="36" y="164" width="40" height="15" rx="7" fill="url(#ck1-steelH)"></rect>
  <rect x="324" y="164" width="40" height="15" rx="7" fill="url(#ck1-steelH)"></rect>
  <ellipse cx="200" cy="150" rx="130" ry="33" fill="url(#ck1-rim)"></ellipse>
  <ellipse cx="200" cy="152" rx="120" ry="28" fill="#4a3a10"></ellipse>
  <ellipse cx="200" cy="152" rx="117" ry="25" fill="url(#ck1-oil)"></ellipse>
  <ellipse cx="160" cy="145" rx="58" ry="8" fill="#fff" opacity=".4"></ellipse>
  <path d="M95 160 Q200 182 305 160" fill="none" stroke="#fff3b0" stroke-width="2" opacity=".6"></path>
  <!-- bubbles -->
  <g fill="url(#ck1-bub)" stroke="#fff" stroke-opacity=".6">
    <circle cx="118" cy="154" r="7"></circle><circle cx="136" cy="163" r="4.5"></circle>
    <circle cx="262" cy="150" r="8"></circle><circle cx="282" cy="159" r="5"></circle>
    <circle cx="192" cy="168" r="6"></circle><circle cx="226" cy="164" r="4"></circle><circle cx="168" cy="136" r="5"></circle>
    <circle cx="245" cy="140" r="4"></circle><circle cx="108" cy="146" r="3"></circle>
  </g>
  <!-- shrimp tempura -->
  <g filter="url(#ck1-sh)">
    <path d="M140 152 Q175 86 235 120" fill="none" stroke="#a8641a" stroke-width="30" stroke-linecap="round"></path>
    <path d="M140 152 Q175 86 235 120" fill="none" stroke="url(#ck1-batter)" stroke-width="26" stroke-linecap="round"></path>
    <path d="M146 140 Q178 94 228 112" fill="none" stroke="#fbe4a8" stroke-width="7" stroke-linecap="round" opacity=".8"></path>
    <path d="M150 150 Q180 104 230 126" fill="none" stroke="#b9701c" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"></path>
    <path d="M236 110 L270 98 L263 121 L272 140 L238 130 Z" fill="url(#ck1-tail)"></path>
    <path d="M240 114 L262 108 M241 122 L264 124 M240 128 L262 136" stroke="#8f2a10" stroke-width="1.5"></path>
  </g>
  <g fill="#c98a2c">
    <circle cx="158" cy="116" r="2.5"></circle><circle cx="182" cy="100" r="2"></circle><circle cx="205" cy="102" r="2.5"></circle><circle cx="130" cy="150" r="2"></circle>
  </g>
  <!-- chopsticks -->
  <g stroke-linecap="round" filter="url(#ck1-sh)">
    <line x1="338" y1="26" x2="210" y2="103" stroke="#8a5420" stroke-width="7"></line>
    <line x1="338" y1="26" x2="210" y2="103" stroke="#d9a465" stroke-width="3" transform="translate(-1 -1)"></line>
    <line x1="360" y1="44" x2="226" y2="116" stroke="#8a5420" stroke-width="7"></line>
    <line x1="360" y1="44" x2="226" y2="116" stroke="#d9a465" stroke-width="3" transform="translate(-1 -1)"></line>
  </g>
  <!-- splashes -->
  <g fill="#f6c33a" stroke="#c98a0c" stroke-width=".8">
    <circle cx="104" cy="118" r="4"></circle><circle cx="302" cy="112" r="4"></circle><circle cx="288" cy="92" r="3"></circle><circle cx="96" cy="100" r="2.5"></circle>
  </g>
</svg>