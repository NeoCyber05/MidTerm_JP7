<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Hình minh họa">
  <defs>
    <radialGradient id="ck12-bg" cx=".5" cy=".4" r=".85"><stop offset="0" stop-color="#FFFBF2"></stop><stop offset="1" stop-color="#E8D3AE"></stop></radialGradient>
    <linearGradient id="ck12-white" x1="0" x2="1"><stop offset="0" stop-color="#d9d3c7"></stop><stop offset=".3" stop-color="#ffffff"></stop><stop offset=".7" stop-color="#ece7dd"></stop><stop offset="1" stop-color="#c3bcad"></stop></linearGradient>
    <linearGradient id="ck12-lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"></stop><stop offset="1" stop-color="#d9d3c7"></stop></linearGradient>
    <radialGradient id="ck12-pot" cx=".5" cy=".3" r=".8"><stop offset="0" stop-color="#cfd4da"></stop><stop offset="1" stop-color="#6b727c"></stop></radialGradient>
    <radialGradient id="ck12-rice" cx=".45" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"></stop><stop offset="1" stop-color="#eee8da"></stop></radialGradient>
    <filter id="ck12-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter>
    <filter id="ck12-sh" x="-20%" y="-20%" width="140%" height="150%"><fedropshadow dx="0" dy="5" stdDeviation="4" flood-color="#2a1800" flood-opacity=".4"></fedropshadow></filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#ck12-bg)"></rect>
  <ellipse cx="210" cy="276" rx="125" ry="11" fill="#3a2a10" opacity=".35" filter="url(#ck12-blur)"></ellipse>
  <!-- steam -->
  <g fill="#fff" opacity=".9" filter="url(#ck12-blur)">
    <circle cx="104" cy="78" r="14"></circle><circle cx="124" cy="62" r="12"></circle><circle cx="92" cy="58" r="9"></circle><circle cx="140" cy="40" r="9"></circle><circle cx="112" cy="44" r="8"></circle>
  </g>
  <!-- lid -->
  <g filter="url(#ck12-sh)">
    <rect x="140" y="28" width="132" height="125" rx="18" fill="url(#ck12-lid)" stroke="#cfc8ba" stroke-width="2"></rect>
    <circle cx="206" cy="76" r="25" fill="#d9dde2" stroke="#a3aab4" stroke-width="2"></circle>
    <circle cx="206" cy="76" r="12" fill="#8d949e"></circle><circle cx="203" cy="73" r="4" fill="#fff" opacity=".6"></circle>
  </g>
  <!-- body -->
  <g filter="url(#ck12-sh)">
    <path d="M95 160 Q92 270 160 274 H260 Q330 270 325 160 Z" fill="url(#ck12-white)" stroke="#cfc8ba" stroke-width="2"></path>
  </g>
  <path d="M112 180 Q110 244 130 262" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".8"></path>
  <ellipse cx="210" cy="160" rx="115" ry="33" fill="url(#ck12-white)" stroke="#cfc8ba" stroke-width="2"></ellipse>
  <ellipse cx="210" cy="162" rx="99" ry="25" fill="url(#ck12-pot)"></ellipse>
  <!-- rice mound -->
  <ellipse cx="210" cy="158" rx="94" ry="21" fill="url(#ck12-rice)"></ellipse>
  <ellipse cx="210" cy="150" rx="64" ry="12" fill="url(#ck12-rice)"></ellipse>
  <g fill="#fffdf6" stroke="#e0d8c4" stroke-width="1.2">
    <ellipse cx="160" cy="156" rx="7" ry="3.5" transform="rotate(10 160 156)"></ellipse><ellipse cx="185" cy="163" rx="7" ry="3.5" transform="rotate(-20 185 163)"></ellipse>
    <ellipse cx="215" cy="152" rx="7" ry="3.5" transform="rotate(25 215 152)"></ellipse><ellipse cx="240" cy="162" rx="7" ry="3.5"></ellipse>
    <ellipse cx="262" cy="156" rx="7" ry="3.5" transform="rotate(-15 262 156)"></ellipse><ellipse cx="200" cy="170" rx="7" ry="3.5" transform="rotate(15 200 170)"></ellipse>
    <ellipse cx="172" cy="146" rx="7" ry="3.5"></ellipse><ellipse cx="250" cy="147" rx="7" ry="3.5" transform="rotate(20 250 147)"></ellipse>
    <ellipse cx="226" cy="144" rx="7" ry="3.5" transform="rotate(-10 226 144)"></ellipse><ellipse cx="195" cy="144" rx="7" ry="3.5" transform="rotate(12 195 144)"></ellipse>
  </g>
  <!-- panel -->
  <rect x="165" y="214" width="90" height="34" rx="9" fill="#d9d3c7" stroke="#bdb5a4" stroke-width="1.5"></rect>
  <circle cx="188" cy="231" r="7" fill="#ef4444"></circle><circle cx="188" cy="229" r="2.5" fill="#fff" opacity=".7"></circle>
  <circle cx="222" cy="231" r="7" fill="#9ca3af"></circle><circle cx="240" cy="231" r="3" fill="#3b82f6"></circle>
</svg>