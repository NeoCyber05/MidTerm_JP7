<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Hình minh họa">
  <defs>
    <radialGradient id="ck4-bg" cx=".5" cy=".4" r=".85"><stop offset="0" stop-color="#FFFBF2"></stop><stop offset="1" stop-color="#E8D3AE"></stop></radialGradient>
    <linearGradient id="ck4-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a504a"></stop><stop offset="1" stop-color="#2a2420"></stop></linearGradient>
    <radialGradient id="ck4-ember" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#ffb347"></stop><stop offset="1" stop-color="#ff4d00" stop-opacity="0"></stop></radialGradient>
    <linearGradient id="ck4-flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ef4444"></stop><stop offset=".45" stop-color="#f97316"></stop><stop offset="1" stop-color="#fde047"></stop></linearGradient>
    <linearGradient id="ck4-bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4d8dd"></stop><stop offset="1" stop-color="#5b6169"></stop></linearGradient>
    <linearGradient id="ck4-steak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2522c"></stop><stop offset=".6" stop-color="#8a2f16"></stop><stop offset="1" stop-color="#5a1c0b"></stop></linearGradient>
    <linearGradient id="ck4-steak2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7683a"></stop><stop offset="1" stop-color="#7a2812"></stop></linearGradient>
    <filter id="ck4-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter>
    <filter id="ck4-sh" x="-20%" y="-20%" width="140%" height="150%"><fedropshadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity=".5"></fedropshadow></filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#ck4-bg)"></rect>
  <rect x="50" y="170" width="300" height="102" rx="14" fill="url(#ck4-body)"></rect>
  <ellipse cx="200" cy="250" rx="140" ry="40" fill="url(#ck4-ember)"></ellipse>
  <!-- flames -->
  <g fill="url(#ck4-flame)">
    <path d="M85 268 Q75 232 95 206 Q100 230 115 236 Q115 220 128 207 Q142 242 130 268 Z"></path>
    <path d="M165 268 Q155 226 177 198 Q182 226 198 232 Q198 214 212 201 Q228 242 215 268 Z"></path>
    <path d="M250 268 Q240 232 260 206 Q265 230 280 236 Q280 220 293 207 Q307 242 295 268 Z"></path>
  </g>
  <g fill="#fff7b0" opacity=".85">
    <path d="M102 268 Q99 250 109 242 Q115 254 117 268 Z"></path><path d="M183 268 Q180 246 191 237 Q199 252 201 268 Z"></path><path d="M267 268 Q264 250 274 242 Q280 254 282 268 Z"></path>
  </g>
  <!-- grate bars -->
  <g filter="url(#ck4-sh)">
    <rect x="36" y="164" width="328" height="8" rx="4" fill="url(#ck4-bar)"></rect>
    <rect x="36" y="176" width="328" height="6" rx="3" fill="url(#ck4-bar)"></rect>
    <g fill="url(#ck4-bar)">
      <rect x="62" y="164" width="6" height="18" rx="2"></rect><rect x="104" y="164" width="6" height="18" rx="2"></rect><rect x="146" y="164" width="6" height="18" rx="2"></rect>
      <rect x="188" y="164" width="6" height="18" rx="2"></rect><rect x="230" y="164" width="6" height="18" rx="2"></rect><rect x="272" y="164" width="6" height="18" rx="2"></rect><rect x="314" y="164" width="6" height="18" rx="2"></rect>
    </g>
  </g>
  <!-- meat -->
  <g filter="url(#ck4-sh)">
    <rect x="74" y="108" width="108" height="62" rx="14" fill="url(#ck4-steak)"></rect>
    <rect x="216" y="102" width="108" height="68" rx="14" fill="url(#ck4-steak)"></rect>
    <rect x="138" y="82" width="98" height="64" rx="14" fill="url(#ck4-steak2)"></rect>
  </g>
  <g fill="#fff" opacity=".2">
    <ellipse cx="110" cy="118" rx="26" ry="5"></ellipse><ellipse cx="252" cy="112" rx="26" ry="5"></ellipse><ellipse cx="172" cy="92" rx="24" ry="5"></ellipse>
  </g>
  <g stroke="#2a0d03" stroke-width="5" stroke-linecap="round" opacity=".85">
    <line x1="94" y1="116" x2="114" y2="160"></line><line x1="120" y1="116" x2="140" y2="160"></line><line x1="146" y1="116" x2="166" y2="160"></line>
    <line x1="236" y1="110" x2="256" y2="160"></line><line x1="262" y1="110" x2="282" y2="160"></line><line x1="288" y1="110" x2="308" y2="160"></line>
    <line x1="158" y1="90" x2="176" y2="138"></line><line x1="184" y1="90" x2="202" y2="138"></line><line x1="210" y1="90" x2="224" y2="138"></line>
  </g>
  <g fill="#fff" opacity=".6"><circle cx="198" cy="92" r="2"></circle><circle cx="296" cy="124" r="2"></circle><circle cx="96" cy="136" r="2"></circle></g>
  <!-- smoke -->
  <g fill="none" stroke="#e5e7eb" stroke-opacity=".8" stroke-width="7" stroke-linecap="round" filter="url(#ck4-blur)">
    <path d="M110 76 q-12 -14 0 -26 q12 -14 0 -26"></path><path d="M286 70 q-12 -14 0 -26 q12 -14 0 -26"></path>
  </g>
</svg>